name: Build & Test

on:
  push:
    branches: [ main, feat/funnel ]
  pull_request:
    branches: [ main, feat/funnel ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install backend dependencies
      run: |
        cd backend
        npm ci

    - name: Build backend
      run: |
        cd backend
        npm run build

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci

    - name: Build frontend
      run: |
        cd frontend
        npm run build

    - name: Build Docker image
      run: docker build -t voice-rag-funnel:test .

    - name: Run health check
      run: |
        docker run -d -p 5000:5000 --name test-app voice-rag-funnel:test
        sleep 5
        curl -f http://localhost:5000/health || exit 1
        docker stop test-app

  docker-push:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/voice-rag-funnel:latest
        cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/voice-rag-funnel:buildcache
        cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/voice-rag-funnel:buildcache,mode=max
