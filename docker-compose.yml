version: '3.8'

services:
  app:
    build: .
    ports:
      - "9045:9045"
    environment:
      - NODE_ENV=production
      - PORT=9045
      - CORS_ORIGIN=http://localhost:9045
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
